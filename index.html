<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свяжитесь со мной</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(34, 158, 217, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(37, 211, 102, 0.12) 0px, transparent 50%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .title {
      color: var(--text-main);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* WhatsApp button */
    .btn-whatsapp {
      background: linear-gradient(135deg, #25d366, #128c7e);
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
    }

    .btn-whatsapp:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
    }

    /* Telegram button */
    .btn-telegram {
      background: linear-gradient(135deg, #2aabee, #229ed9);
      box-shadow: 0 4px 14px rgba(34, 158, 217, 0.3);
    }

    .btn-telegram:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 20px rgba(34, 158, 217, 0.4);
    }

    .btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
    }
  </style>
</head>
